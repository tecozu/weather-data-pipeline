# All credentials come from .env (copy .env.example). Nothing secret is committed.
x-superset-common: &superset-common
  image: apache/superset:3.0.0-py310
  user: root
  env_file: [.env]
  volumes:
    - ./docker:/app/docker
    - ./docker/superset_config.py:/app/pythonpath/superset_config.py
  networks: [weather-net]

services:
  db:
    image: postgres:16
    container_name: weather_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    env_file: [.env]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    networks: [weather-net]

  airflow:
    image: apache/airflow:3.0.3
    container_name: weather_airflow
    ports: ["8080:8080"]
    env_file: [.env]
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@db:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      POSTGRES_HOST: db
      DOCKER_NETWORK: weather-data-pipeline_weather-net
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./ingestion:/opt/airflow/ingestion
      - /var/run/docker.sock:/var/run/docker.sock
    group_add: ["${DOCKER_GID:-0}"]
    depends_on:
      db: { condition: service_healthy }
    command: bash -c "airflow db migrate && airflow standalone"
    networks: [weather-net]

  superset-init:
    <<: *superset-common
    container_name: weather_superset_init
    command: ["/app/docker/docker-init.sh"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  superset:
    <<: *superset-common
    container_name: weather_superset
    command: ["/app/docker/docker-bootstrap.sh", "app"]
    restart: unless-stopped
    ports: ["8088:8088"]
    depends_on:
      superset-init: { condition: service_completed_successfully }

  redis:
    image: redis:7
    container_name: weather_redis
    restart: unless-stopped
    volumes: [redis:/data]
    networks: [weather-net]

networks:
  weather-net:
    driver: bridge

volumes:
  pgdata:
  redis:
